name: JCloudSync CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit & Integration Tests (Testcontainers MinIO)
        run: mvn clean test -B

      - name: Package Executable Fat JAR
        run: mvn package -DskipTests -B

      - name: Verify CLI Executable Smoke Test
        run: |
          java -jar target/jcloud-sync-1.0.0-SNAPSHOT.jar --help
          java -jar target/jcloud-sync-1.0.0-SNAPSHOT.jar init --force
          java -jar target/jcloud-sync-1.0.0-SNAPSHOT.jar sync --once --mock
          java -jar target/jcloud-sync-1.0.0-SNAPSHOT.jar status --mock

      - name: Archive Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jcloud-sync-jar
          path: target/jcloud-sync-1.0.0-SNAPSHOT.jar
          retention-days: 7

  docker-build:
    name: Build & Verify Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: jcloud-sync:latest
          load: true

      - name: Smoke Test Docker Container
        run: docker run --rm jcloud-sync:latest --help
